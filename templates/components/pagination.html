{% if is_paginated %}<nav class="pagination-bar" aria-label="Pagination"><span>Page {{ page_obj.number }} of {{ paginator.num_pages }} <span class="text-muted">· {{ paginator.count }} results</span></span><div>{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% endif %}</div></nav>{% endif %}
