name: WeFiles Django
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wefiles
          POSTGRES_PASSWORD: ci-only-wefiles
          POSTGRES_DB: wefiles
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wefiles -d wefiles"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: .
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://wefiles:ci-only-wefiles@localhost:5432/wefiles' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test --noinput
      - run: coverage report
