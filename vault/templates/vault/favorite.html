{% load ui %}<form class="favorite-form" action="{% url 'vault:favorite' file.pk %}" method="post" hx-post="{% url 'vault:favorite' file.pk %}" hx-swap="outerHTML" hx-disabled-elt="find button">{% csrf_token %}<button class="icon-button {% if is_saved %}is-saved{% endif %}" type="submit" aria-pressed="{% if is_saved %}true{% else %}false{% endif %}" aria-label="{% if is_saved %}Unsave{% else %}Save{% endif %} {{ file.name }}">{% icon 'bookmark' %}</button></form>
