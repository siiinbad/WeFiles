{% load ui %}<div class="events-list">{% for event in events %}<article class="event-row"><span class="event-dot"></span><div><p><strong>{{ event.actor.name|default:'Deleted account' }}</strong> {{ event.description }}</p><span>{{ event.object_label }}</span><small>{{ event.created_at|date:'M j, Y, g:i a' }}</small></div></article>{% empty %}<div class="empty-state compact">{% icon 'clock' %}<h3>A clean slate.</h3><p>Important workspace changes will appear here.</p></div>{% endfor %}</div>
