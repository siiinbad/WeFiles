[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", "static", "media", "staticfiles", ".venv", "legacy", ".git", ".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["accounts", "vault", "chat", "notifications", "activity", "core"]
omit = ["*/migrations/*", "*/tests*", "*/tests/*", "*/management/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
